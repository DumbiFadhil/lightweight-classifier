version: '3.8'

services:
  bert-cpp:
    build: .
    container_name: bert-cpp-test
    ports:
      - "8085:8085"
    volumes:
      # Mount a volume to persist models and outputs
      - bert-models:/app/models
      - bert-outputs:/app/outputs
    # Keep container running for interactive use
    tty: true
    stdin_open: true
    # Override the default command to keep container alive
    command: tail -f /dev/null

volumes:
  bert-models:
  bert-outputs: