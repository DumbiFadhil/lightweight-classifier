version: '3.8'

services:
  indonesian-query-classifier:
    build:
      context: .
      dockerfile: Dockerfile.light
    container_name: indonesian-classifier
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    environment:
      - PYTHONPATH=/app/src
    # Keep container running for interactive use
    tty: true
    stdin_open: true
    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s